name: OneShotOneKill_26.1.2
version: 1.0.0-26.1.2
main: de.oneshotonekill.OneShotOneKill
api-version: '1.21'
author: Leopold
description: OneShotOneKill Minigame Plugin (Spezielle Version fuer Spigot/Minecraft 26.1.2)

commands:
  oneshot:
    description: Hauptbefehl fuer das OneShotOneKill Minigame
    aliases: [osok]
    usage: /oneshot [setspawn|resetmap|resetstats|itemmode]
  start:
    description: Startet das Match und teleportiert alle Spieler zufaellig in die Arena
    usage: /start
  resetstats:
    description: Setzt alle Kills, Tode und Streaks auf dem Scoreboard zurueck
    aliases: [resetboard]
    usage: /resetstats
  itemtest:
    description: Oeffnet das Spezial-Item Testmenue fuer Admins
    aliases: [testgui]
    usage: /itemtest
  itemmode:
    description: Wechselt den Spezial-Item Modus zwischen Streak und Map-Spawn
    aliases: [itemmodus, mode]
    usage: /itemmode [streak|spawn]
  clearpfeile:
    description: Loescht sofort alle herumliegenden Pfeile aus der Welt
    usage: /clearpfeile
  killeffect:
    description: Oeffnet das Menue zur Auswahl deines persoehnlichen Kill-Effekts
    aliases: [effects]
    usage: /killeffect
