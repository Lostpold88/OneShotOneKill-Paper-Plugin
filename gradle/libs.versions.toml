[versions]
# Die paper-api steht hier bewusst NICHT: Ihre Version liest der Build aus Server/server.jar und
# hat damit genau eine Quelle - ein zweiter, gepinnter Wert koennte davon abweichen. Siehe
# build.gradle.kts.
kotlin = "2.4.10"

[libraries]
# Wird in die Plugin-JAR gebuendelt: Paper bringt die stdlib nicht mit und paper-plugin.yml hat
# kein libraries-Feld. Warum Papers PluginLoader hier ausscheidet, steht in .agents/AGENTS.md.
kotlin-stdlib = { module = "org.jetbrains.kotlin:kotlin-stdlib", version.ref = "kotlin" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
